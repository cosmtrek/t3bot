# Push a tag `vX.Y.Z` on a commit that is on main → build Linux binaries and publish a GitHub release.
# The tag must match `version` in Cargo.toml.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Tag is on main and matches Cargo.toml
        run: |
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main \
            || { echo "::error::$GITHUB_REF_NAME does not point to a commit on main"; exit 1; }
          v=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n1)
          [ "v$v" = "$GITHUB_REF_NAME" ] \
            || { echo "::error::tag $GITHUB_REF_NAME does not match Cargo.toml version v$v"; exit 1; }
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --locked

  build:
    needs: check
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-24.04
          - target: aarch64-unknown-linux-musl
            os: ubuntu-24.04-arm
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y musl-tools
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Build (static, musl)
        run: |
          cc_var="CC_$(echo '${{ matrix.target }}' | tr '-' '_')"
          export "$cc_var=musl-gcc"
          cargo build --release --locked --target ${{ matrix.target }}
      - name: Package
        run: |
          name="t3bot-${GITHUB_REF_NAME}-${{ matrix.target }}"
          mkdir -p "dist/$name"
          cp "target/${{ matrix.target }}/release/t3bot" "dist/$name/"
          cp -r skill contrib README.md "dist/$name/"
          [ -f LICENSE ] && cp LICENSE "dist/$name/"
          cd dist
          tar czf "$name.tar.gz" "$name"
          sha256sum "$name.tar.gz" > "$name.tar.gz.sha256"
          "./$name/t3bot" --version
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: dist/*.tar.gz*

  release:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd dist
          cat *.sha256 > SHA256SUMS
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" --generate-notes \
            *.tar.gz *.sha256 SHA256SUMS
