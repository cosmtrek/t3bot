[package]
name = "t3bot"
version = "0.3.0"
edition = "2024"
license = "MIT"
publish = false
repository = "https://github.com/cosmtrek/t3bot"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
